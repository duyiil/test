# 一键部署。变量来自仓库根目录的 .env（由 scripts/install.sh 生成）。
# 演示服务默认不启动。需要时：docker compose --profile demo up -d
name: zhitest

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhitest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 ./scripts/install.sh 生成 .env}
      POSTGRES_DB: ${POSTGRES_DB:-zhitest}
    volumes:
      - zhitest-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhitest} -d ${POSTGRES_DB:-zhitest}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./zhitest/backend
    image: zhitest-backend:local
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhitest}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zhitest}
      ZHITEST_ENV: ${ZHITEST_ENV:-production}
      ZHITEST_AUTO_BOOTSTRAP: "true"
      ZHITEST_ADMIN_USERNAME: ${ZHITEST_ADMIN_USERNAME:-admin}
      ZHITEST_ADMIN_PASSWORD: ${ZHITEST_ADMIN_PASSWORD:?请先运行 ./scripts/install.sh 生成 .env}
      ZHITEST_ADMIN_DISPLAY_NAME: ${ZHITEST_ADMIN_DISPLAY_NAME:-系统管理员}
      ZHITEST_SECRET_KEY: ${ZHITEST_SECRET_KEY:-}
      ZHITEST_SESSION_TTL_SECONDS: ${ZHITEST_SESSION_TTL_SECONDS:-7200}
      ZHITEST_COOKIE_SECURE: "false"
      ZHITEST_TRUST_PROXY: "true"
      ZHITEST_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      ZHITEST_LOG_LEVEL: ${ZHITEST_LOG_LEVEL:-INFO}
      # 容器里的演示服务主机名是 sut。不要改成只读宿主机 .env，否则执行会被 SSRF 拒绝。
      ZHITEST_TARGET_ALLOWLIST: 127.0.0.1,localhost,::1,sut
      ZHITEST_LLM_BASE_URL: ${ZHITEST_LLM_BASE_URL:-https://api.deepseek.com}
      ZHITEST_LLM_MODEL: ${ZHITEST_LLM_MODEL:-deepseek-chat}
      ZHITEST_LLM_API_KEY: ${ZHITEST_LLM_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 25s
    restart: unless-stopped

  worker:
    build:
      context: ./zhitest/backend
    image: zhitest-backend:local
    pull_policy: build
    environment:
      <<: *backend_env
      ZHITEST_AUTO_BOOTSTRAP: "false"
    entrypoint: ["/entrypoint.sh", "worker"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./zhitest/frontend
    image: zhitest-web:local
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  sut:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: demo/sut/Dockerfile
    image: zhitest-sut:local
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  zhitest-pg:
